# Builds the Android app on GitHub's computers and attaches it to a release.
#
# - Push a tag like v0.1.0, or: Actions tab → "Build Android app" → Run workflow and type a version.
# - The file always has the same name, so this link always gives the newest version:
#   https://github.com/nosugarlessice/sip./releases/latest/download/sip-android.apk
#
# Signing: add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD (key alias "sip") under
# Settings → Secrets and variables → Actions. Without them the build is debug-signed: it installs fine,
# but later versions can't update it in place.

name: Build Android app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 0.1.0 (leave empty for a test build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm install --no-audit --no-fund
      - run: pip install pillow
      - run: python3 prepare.py www
      - run: npx cap add android
      - run: python3 prepare.py native "${{ inputs.version || github.ref_name }}" "${{ github.run_number }}"
      - run: npx cap sync android
      - name: Build
        working-directory: android/android
        run: chmod +x gradlew && ./gradlew assembleRelease assembleDebug --no-daemon
      - name: Sign
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          OUT=android/app/build/outputs/apk
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > release.p12
            "$BT/zipalign" -p -f 4 $OUT/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign --ks release.p12 --ks-type PKCS12 --ks-pass env:KS_PASS --ks-key-alias sip --key-pass env:KS_PASS --out sip-android.apk aligned.apk
            rm release.p12
          else
            echo "::warning::No signing key: this build is debug-signed."
            cp $OUT/debug/app-debug.apk sip-android.apk
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: sip-android
          path: android/sip-android.apk
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref_name }}
          name: ${{ inputs.version != '' && format('sip. {0}', inputs.version) || format('sip. {0}', github.ref_name) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: android/sip-android.apk
          body: |
            **Android:** download `sip-android.apk` on your phone and open it. If Android asks, allow your browser to install apps, then tap **Install**.
            **iPhone:** open https://nosugarlessice.github.io/sip./app/ in Safari, then Share → Add to Home Screen.
